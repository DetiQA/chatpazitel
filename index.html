:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1527; --surface:#251e36; --ink:#f1ecfb; --muted:#b2a8c9; --violet:#b48bf0; --violet-soft:#3a2d57;
  --green:#7fd477; --green-soft:#23402a; --gold:#ffcf4a; --gold-soft:#4a3d14; --red:#ff8a8a; --red-soft:#4d2323;
  --blue:#8fb6ff; --blue-soft:#22324f; --line:#3d3356; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1527; --surface:#251e36; --ink:#f1ecfb; --muted:#b2a8c9; --violet:#b48bf0; --violet-soft:#3a2d57;
  --green:#7fd477; --green-soft:#23402a; --gold:#ffcf4a; --gold-soft:#4a3d14; --red:#ff8a8a; --red-soft:#4d2323;
  --blue:#8fb6ff; --blue-soft:#22324f; --line:#3d3356; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
header{display:flex;align-items:center;gap:12px}
header .logo{width:52px;height:52px;flex:0 0 auto}
header h1{font-size:24px;color:var(--violet)}
header .hi{color:var(--muted);font-weight:700}
.stars{margin-left:auto;background:var(--gold-soft);color:var(--ink);border:2px solid var(--gold);border-radius:999px;padding:6px 12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}

.level .row span:last-child{color:var(--muted);font-weight:700}
.bar{height:12px;border-radius:999px;background:var(--violet-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);border-radius:999px;transition:width .4s}
.heroes{display:grid;gap:12px}
.hero{display:flex;align-items:center;gap:12px;background:var(--surface);border:3px solid var(--c);border-radius:20px;padding:10px 14px;text-align:left;width:100%}
.hero:hover{transform:translateY(-2px)}
.hero svg{width:76px;height:82px;flex:0 0 auto}
.hero .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.hero b{font-family:var(--display);font-size:19px;color:var(--c)}
.hero small{color:var(--muted);font-size:15px}
.big{background:var(--violet);color:#fff;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:19px;width:100%}
.ghost{background:transparent;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800}
.quiz{background:var(--surface);border:3px solid var(--c,var(--violet));border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop svg{width:70px;height:76px;flex:0 0 auto}
.bubble{background:var(--violet-soft);border-radius:16px;padding:10px 12px;font-weight:700;min-width:0}
.bubble .who{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.qnum{color:var(--muted);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.answers{display:grid;gap:10px}
.ans{text-align:left;background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;display:flex;gap:10px}
.ans .k{font-family:var(--display);color:var(--violet);flex:0 0 auto}
.ans.ok{background:var(--green-soft);border-color:var(--green)}
.ans.bad{background:var(--red-soft);border-color:var(--red)}
.ans:disabled{cursor:default}
.why{border-radius:16px;padding:12px 14px;font-weight:700}
.why.ok{background:var(--green-soft)} .why.bad{background:var(--gold-soft)}
.end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.end .medal{font-size:56px;line-height:1}
.end h2{font-size:26px;color:var(--violet)}
.parents{border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.parents summary{font-weight:800;color:var(--muted);cursor:pointer}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.panel h3{font-size:17px}
.stat{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.pend{border:2px solid var(--gold);background:var(--gold-soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.pend .btns{display:flex;gap:8px;flex-wrap:wrap}
.ok-btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:800}
.del-btn{background:transparent;border:2px solid var(--red);color:var(--red);border-radius:10px;padding:6px 12px;font-weight:800}
label{font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px}
.note{font-size:14px;color:var(--muted)}
.toast{font-weight:800;color:var(--green)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.hero:hover{transform:none}}
</style>

</head>

["lupa","Някой в чата ти пише: „Не казвай на родителите си, че си говорим.“ Какво правиш?",["Пазя тайната","Веднага казвам на родител","Пиша му още"],1,"Ако някой те кара да криеш от родителите си, това е сигнал за опасност."],

["lupa","Получи линк от непознат: „Виж тази смешна игра!“ Какво правиш?",["Отварям го","Не го отварям и питам възрастен","Пращам го на всички"],1,"Непознатите линкове могат да съдържат вируси или измами."],
["lupa","Някой обещава безплатни Robux, ако му дадеш паролата си. Какво е това?",["Хубав подарък","Измама","Нова игра"],1,"Безплатни Robux срещу парола е най-честата измама в Roblox."],
["lupa","Непознат ти пише много мили неща и иска твоя снимка. Какво правиш?",["Пращам снимка","Не пращам и казвам на родител","Пращам снимка на приятелка"],1,"Не пращай снимки на непознати, колкото и мили да изглеждат."],
["lupa","Видео в интернет казва нещо много странно. Как разбираш дали е истина?",["Всичко в интернет е истина","Питам възрастен или проверявам на друго място","Пращам го на всички, за да видят"],1,"Не всичко в интернет е вярно. Добрият детектив проверява."],

["dobri","Някой пише ГЛАВНИ БУКВИ И МНОГО УДИВИТЕЛНИ!!! Как звучи това?",["Като че ли вика","Като шепот","Като песен"],0,"Главните букви в чата звучат като викане. Пиши спокойно."],

["dobri","Някой те тормози в игра всеки ден. На кого казваш?",["На никого","На родител или учител","Само на котката"],1,"Възрастните могат да помогнат. Не трябва да се справяш сама."],
["dobri","Деца създадоха група, за да говорят лошо за съученичка. Канят и теб. Какво правиш?",["Влизам","Отказвам и казвам на възрастен","Влизам, но само гледам"],1,"Да кажеш „не“ на лошото е истинска смелост."],

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LEVELS=[[0,"Малък пазител"],[15,"Смел пазител"],[40,"Супер пазител"],[80,"Пазител на интернета"]];
function level(){let cur=LEVELS[0],next=null;for(let i=0;i<LEVELS.length;i++){if(prog.stars>=LEVELS[i][0]){cur=LEVELS[i];next=LEVELS[i+1]||null}}return{cur,next}}
function allQ(){return BASE.concat(extra)}

function saveProg(){
  try{localStorage.setItem(LS,JSON.stringify(prog))}catch(e){}
  $("#stars").textContent="⭐ "+prog.stars;
}

function home(){
  $("#stars").textContent="⭐ "+prog.stars;
  const {cur,next}=level();
  const pct=next?Math.round((prog.stars-cur[0])/(next[0]-cur[0])*100):100;
  const qs=allQ();
  $("#view").innerHTML=`<div class="wrap" style="gap:16px">
   <div class="level"><div class="row"><span>${esc(cur[1])}</span><span>${next?`още ${next[0]-prog.stars} ⭐ до „${esc(next[1])}“`:"Най-високо ниво!"}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
   <h2 style="font-size:20px">Избери герой и помогни на Яна</h2>
   <div class="heroes">${Object.entries(TOPICS).map(([k,t])=>`<button class="hero" style="--c:${t.c}" data-t="${k}">${HERO_SVG[k]}<span class="t"><b>${t.name}</b><small>${t.sub} · ${qs.filter(q=>q.topic===k).length} въпроса</small></span></button>`).join("")}</div>
   <button class="big" id="mix">Играй с всички герои</button>
  </div>`;
  document.querySelectorAll(".hero").forEach(b=>b.onclick=()=>start(b.dataset.t));
  $("#mix").onclick=()=>start(null);
}

let round=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(topic){
  const pool=allQ().filter(q=>!topic||q.topic===topic);
  round={list:shuffle(pool).slice(0,5),i:0,got:0};
  showQ();
}
function showQ(){
  const q=round.list[round.i],t=TOPICS[q.topic];
  const order=shuffle([0,1,2]);
  $("#view").innerHTML=`<div class="quiz" style="--c:${t.c}">
   <div class="qnum">Въпрос ${round.i+1} от ${round.list.length}</div>
   <div class="qtop">${HERO_SVG[q.topic]}<div class="bubble"><span class="who">${t.name} пита</span>${esc(q.q)}</div></div>
   <div class="answers">${order.map((ai,n)=>`<button class="ans" data-a="${ai}"><span class="k">${"АБВ"[n]})</span><span>${esc(q.a[ai])}</span></button>`).join("")}</div>
   <div id="fb"></div>
   <button class="ghost" id="quit" style="align-self:flex-start">← Към героите</button></div>`;
  document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(q,+b.dataset.a));
  $("#quit").onclick=home;
}
function answer(q,a){
  const ok=a===q.correct;
  document.querySelectorAll(".ans").forEach(b=>{b.disabled=true;const v=+b.dataset.a;if(v===q.correct)b.classList.add("ok");else if(v===a)b.classList.add("bad")});
  prog.answered++;
  if(ok){prog.correct++;prog.stars++;round.got++;prog.right[q.topic]=(prog.right[q.topic]||0)+1}else{prog.wrong[q.topic]=(prog.wrong[q.topic]||0)+1}
  saveProg();
  const last=round.i===round.list.length-1;
  $("#fb").innerHTML=`<div class="why ${ok?"ok":"bad"}">${ok?"Браво, Яна! +1 ⭐ ":"Почти! Ето защо: "}${esc(q.why)}</div>
   <button class="big" id="next" style="margin-top:10px">${last?"Виж резултата":"Следващ въпрос →"}</button>`;
  $("#next").onclick=()=>{if(last)finish();else{round.i++;showQ()}};
  $("#next").focus();
}
function finish(){
  const n=round.list.length,g=round.got;
  const medal=g===n?"🏆":g>=n-2?"🥇":"🌱";
  $("#view").innerHTML=`<div class="quiz end"><div class="medal">${medal}</div><h2>${g===n?"Перфектно, Яна!":g>=n-2?"Много добре, Яна!":"Продължавай да се учиш!"}</h2>
   <p style="margin:0;font-weight:700">Позна ${g} от ${n} и спечели ${g} ⭐</p>
   <p style="margin:0" class="note">Общо звезди: ${prog.stars} · Ниво: ${esc(level().cur[1])}</p>
   <button class="big" id="again">Играй пак</button><button class="ghost" id="back">Към героите</button></div>`;
  $("#again").onclick=()=>start(null);$("#back").onclick=home;
}

// ---- Parents panel (PIN protected) ----
let unlocked=false;
function saveQ(){try{localStorage.setItem(LSQ,JSON.stringify(extra))}catch(e){}}
function parents(){
  $("#parents").hidden=false;
  if(!unlocked){
    $("#ppanel").innerHTML=`<div class="panel"><form id="pinf" style="display:flex;flex-direction:column;gap:8px">
     <label>Код за родители<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
     <button class="ok-btn" type="submit">Влез</button><span id="pinmsg" class="note"></span></form></div>`;
    $("#pinf").onsubmit=e=>{e.preventDefault();if($("#pin").value===PIN){unlocked=true;parents()}else{$("#pinmsg").textContent="Грешен код. Опитай отново."}};
    return;
  }
  const pct=prog.answered?Math.round(prog.correct/prog.answered*100):0;
  const weak=Object.entries(prog.wrong).sort((a,b)=>b[1]-a[1])[0];
  $("#ppanel").innerHTML=`
  <div class="panel"><h3>Резултати на Яна</h3>
   <div class="stat"><span>Отговорени въпроси</span><b>${prog.answered}</b></div>
   <div class="stat"><span>Верни</span><b>${prog.correct} (${pct}%)</b></div>
   ${Object.entries(TOPICS).map(([k,t])=>`<div class="stat"><span>${t.name}: грешки</span><b>${prog.wrong[k]||0}</b></div>`).join("")}
   ${weak&&weak[1]>0?`<p class="note" style="margin:0">Най-много грешки: <b>${TOPICS[weak[0]].name}</b> (${TOPICS[weak[0]].sub.toLowerCase()}). Добра тема за разговор.</p>`:""}
  </div>
  <div class="panel"><h3>Добавени въпроси (${extra.length})</h3>
   ${extra.length?extra.map(p=>`<div class="pend"><b>${TOPICS[p.topic].name}: ${esc(p.q)}</b><div class="btns"><button class="del-btn" data-del="${p.id}">Изтрий</button></div></div>`).join(""):`<p class="note" style="margin:0">Още няма добавени въпроси.</p>`}
  </div>
  <div class="panel"><h3>Добави свой въпрос</h3>
   <form id="addf" style="display:flex;flex-direction:column;gap:8px">
    <label>Герой<select id="f-topic">${Object.entries(TOPICS).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join("")}</select></label>
    <label>Въпрос<textarea id="f-q" rows="2" required></textarea></label>
    <label>Верен отговор<input id="f-a0" required></label>
    <label>Грешен отговор 1<input id="f-a1" required></label>
    <label>Грешен отговор 2<input id="f-a2" required></label>
    <label>Обяснение<input id="f-why" required></label>
    <button class="ok-btn" type="submit">Добави въпроса</button><span id="ftoast" class="toast"></span>
   </form>
   <p class="note" style="margin:0">Добавените въпроси се пазят само на това устройство.</p>
   <button class="del-btn" id="reset" type="button">Нулирай звездите на Яна</button>
  </div>`;
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{extra=extra.filter(q=>q.id!==b.dataset.del);saveQ();parents();home()});
  $("#addf").onsubmit=e=>{e.preventDefault();
    extra.push({id:"u"+Date.now(),topic:$("#f-topic").value,q:$("#f-q").value.trim(),a:[$("#f-a0").value.trim(),$("#f-a1").value.trim(),$("#f-a2").value.trim()],correct:0,why:$("#f-why").value.trim()});
    saveQ();parents();home();$("#ftoast").textContent="Добавен!";};
  $("#reset").onclick=()=>{prog={stars:0,answered:0,correct:0,wrong:{shield:0,lupa:0,dobri:0},right:{shield:0,lupa:0,dobri:0}};saveProg();parents();home()};
}

home();
parents();
</script>
</body>
</html>
